name: Kalzone build
run-name: platform release ${{ inputs.release_id }}

on:
  workflow_dispatch:
    inputs:
      release_id:
        required: true
      image:
        required: true
      platform_url:
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  build:
    uses: klzn-labs/kalzone-actions/.github/workflows/build.yml@main
    with:
      release_id: ${{ inputs.release_id }}
      image: ${{ inputs.image }}
      platform_url: ${{ inputs.platform_url }}
